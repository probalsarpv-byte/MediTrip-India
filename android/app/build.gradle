plugins { id 'com.android.application' }
def signingPath = System.getenv('MEDITRIP_KEYSTORE')
android {
    namespace 'com.meditrip.india'
    buildFeatures { buildConfig true }
    compileSdk 36
    defaultConfig {
        applicationId 'com.meditrip.india'
        minSdk 26
        targetSdk 36
        versionCode 3
        versionName '2.1.0'
    }
    sourceSets { main { assets.srcDirs = ['../../web'] } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    if (signingPath) {
        signingConfigs {
            release {
                storeFile file(signingPath)
                storePassword System.getenv('MEDITRIP_STORE_PASSWORD')
                keyAlias System.getenv('MEDITRIP_KEY_ALIAS')
                keyPassword System.getenv('MEDITRIP_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.debug'; debuggable true }
        release {
            minifyEnabled false
            if (signingPath) signingConfig signingConfigs.release
        }
    }
}
tasks.register('validatePublisher') {
    doLast {
        def config = file('../../web/config.js').getText('UTF-8')
        if (!(config =~ /supportEmail:\s*'[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}'/).find())
            throw new GradleException('Add your supportEmail to web/config.js before release.')
        if (!(config =~ /privacyPolicyUrl:\s*'https:\/\/[^']+'/).find())
            throw new GradleException('Add your public HTTPS privacyPolicyUrl to web/config.js before release.')
        if (!signingPath || !System.getenv('MEDITRIP_STORE_PASSWORD') || !System.getenv('MEDITRIP_KEY_ALIAS') || !System.getenv('MEDITRIP_KEY_PASSWORD'))
            throw new GradleException('Set the four MEDITRIP signing environment variables. Never commit signing keys.')
    }
}
tasks.configureEach { task -> if (task.name == 'preReleaseBuild') task.dependsOn('validatePublisher') }
