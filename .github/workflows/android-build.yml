name: Build MediTrip Android
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: Debug APK for testing, or signed release AAB
        required: true
        default: debug
        type: choice
        options: [debug, release]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install required SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v6
      - name: Prepare release upload key
        if: inputs.build_type == 'release'
        env:
          MEDITRIP_KEYSTORE_BASE64: ${{ secrets.MEDITRIP_KEYSTORE_BASE64 }}
        run: |
          test -n "$MEDITRIP_KEYSTORE_BASE64"
          umask 077
          printf '%s' "$MEDITRIP_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/meditrip-upload.jks"
      - name: Build debug APK and lint
        if: inputs.build_type == 'debug'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug lintDebug --no-daemon
      - name: Build signed release AAB and lint
        if: inputs.build_type == 'release'
        working-directory: android
        env:
          MEDITRIP_KEYSTORE: ${{ runner.temp }}/meditrip-upload.jks
          MEDITRIP_STORE_PASSWORD: ${{ secrets.MEDITRIP_STORE_PASSWORD }}
          MEDITRIP_KEY_ALIAS: ${{ secrets.MEDITRIP_KEY_ALIAS }}
          MEDITRIP_KEY_PASSWORD: ${{ secrets.MEDITRIP_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew lintRelease bundleRelease --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: meditrip-${{ inputs.build_type }}
          if-no-files-found: error
          retention-days: 7
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
      - name: Remove temporary signing file
        if: always()
        run: rm -f "$RUNNER_TEMP/meditrip-upload.jks"
